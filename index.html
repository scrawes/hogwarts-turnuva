<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Turnuvası</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        /* --- AYARLAR VE RENKLER --- */
        :root {
            /* Varsayılan (Karanlık Mod için Ayarlı) */
            --bg-color: #121212;
            --bg-pattern: url('https://www.transparenttextures.com/patterns/dark-matter.png');
            --text-main: #e0e0e0;
            --text-gold: #ffc107; /* Daha parlak, okunabilir altın */
            --card-bg: #1e1e24;
            --navbar-bg: #15151a; /* Navbar rengi */
            --border-color: #333;
            --accent-red: #a00;
            --glow: 0 0 10px rgba(255, 193, 7, 0.1);
            --line-color: #555;
        }

        /* Aydınlık Mod (Lumos) */
        body.light-theme {
            --bg-color: #f4f1ea;
            --bg-pattern: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            --text-main: #2c1810;
            --text-gold: #8a0303; /* Aydınlık modda koyu kırmızı vurgu */
            --card-bg: #fff;
            --navbar-bg: #e8e5de;
            --border-color: #d3a625;
            --accent-red: #d3a625;
            --glow: 0 5px 15px rgba(0,0,0,0.1);
            --line-color: #b89f7a;
        }

        body {
            font-family: 'Crimson Text', serif;
            background-color: var(--bg-color);
            background-image: var(--bg-pattern);
            color: var(--text-main);
            margin: 0; 
            padding: 20px;
            padding-top: 100px; /* Navbar için boşluk */
            transition: all 0.4s ease;
        }

        /* Başlık Fontları */
        h1, h2, h3, .brand-font { font-family: 'Cinzel Decorative', cursive; }

        .container { max-width: 1400px; margin: 0 auto; }

        /* --- NAVBAR (YENİ EKLENDİ) --- */
        .navbar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: 80px;
            background-color: var(--navbar-bg);
            border-bottom: 2px solid var(--text-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 1000;
            box-shadow: var(--glow);
            transition: background-color 0.4s ease;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .site-logo {
            height: 50px;
            width: auto;
            border-radius: 50%;
            border: 2px solid var(--text-gold);
        }

        .site-name {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.5rem;
            color: var(--text-gold);
            margin: 0;
        }

        /* --- THEME BUTTON (DÜZENLENDİ) --- */
        .theme-btn {
            background: var(--card-bg); 
            border: 1px solid var(--text-gold);
            color: var(--text-gold); 
            padding: 8px 16px; 
            border-radius: 20px;
            cursor: pointer; 
            font-family: 'Cinzel Decorative'; 
            box-shadow: var(--glow);
            transition: all 0.3s ease;
        }
        .theme-btn:hover { background: var(--text-gold); color: var(--bg-color); }

        /* --- DUYURULAR PANELİ (ESKİ HEADER) --- */
        .header-box {
            text-align: center; padding: 40px; margin-bottom: 40px;
            background: var(--card-bg); border-radius: 12px;
            border: 1px solid var(--border-color); box-shadow: var(--glow);
            position: relative;
        }
        .main-title { font-size: 2.5rem; color: var(--text-gold); margin-bottom: 15px; border-bottom: 1px solid var(--line-color); display: inline-block; padding-bottom: 10px; }
        .announcement-text { font-size: 1.2rem; font-style: italic; opacity: 0.9; margin-bottom: 20px; }
        .countdown { font-size: 2rem; font-weight: bold; font-family: 'Cinzel Decorative'; letter-spacing: 2px; opacity: 0.7; }

        /* --- WIDGET (Sıradaki Maç) --- */
        .widget-row {
            display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 50px;
        }
        .widget-card {
            flex: 1; background: var(--card-bg); padding: 25px; border-radius: 12px;
            border: 1px solid var(--border-color); text-align: center; box-shadow: var(--glow);
            min-width: 300px;
        }
        .w-title { font-size: 0.9rem; letter-spacing: 3px; color: var(--text-gold); opacity: 0.7; margin-bottom: 15px; text-transform: uppercase; }
        .w-big-text { font-size: 1.8rem; font-weight: bold; margin-bottom: 5px; }
        .w-sub { font-size: 1.2rem; color: var(--text-gold); font-family: 'Cinzel Decorative'; }
        
        .weather-wrap { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .weather-icon { font-size: 3rem; }

        /* --- TURNUVA AĞACI --- */
        .bracket-section {
            padding: 40px 0;
            overflow-x: auto; /* Sığmazsa kaydır */
            text-align: center;
        }
        .bracket-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px; /* Sütunlar arası boşluk */
            min-width: 900px;
            margin: 0 auto;
        }

        .column {
            display: flex; flex-direction: column; 
            justify-content: space-around;
            width: 240px; position: relative;
        }
        .col-qf { height: 600px; } /* Çeyrek Final Boyu */
        .col-sf { height: 450px; } /* Yarı Final Boyu */
        .col-fi { height: 200px; } /* Final Boyu */

        /* Çizgiler */
        .col-qf::after, .col-sf::after {
            content: ''; position: absolute; right: -30px; top: 20px; bottom: 20px;
            border-right: 2px dashed var(--line-color); opacity: 0.3;
        }

        .match-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 15px; border-radius: 8px; box-shadow: var(--glow);
            position: relative; transition: transform 0.3s;
        }
        .match-card:hover { transform: scale(1.05); border-color: var(--text-gold); }
        .match-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--text-gold); border-radius: 4px 0 0 4px;
        }

        .m-team { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .m-team:last-child { border: none; }
        .m-logo { width: 25px; height: 25px; border-radius: 50%; margin-right: 10px; background: #ddd; vertical-align: middle; }
        .m-name { font-size: 0.95rem; font-weight: 600; flex-grow: 1; text-align: left; }
        .m-score { color: var(--text-gold); font-weight: bold; font-family: 'Cinzel Decorative'; }

        /* --- TAKIMLAR (4 x 2 DÜZENİ) --- */
        .section-header { text-align: center; margin: 60px 0 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .section-header h2 { font-size: 2.5rem; color: var(--text-gold); margin: 0; }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 25px;
            margin-bottom: 80px;
        }
        @media (max-width: 1100px) { .team-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .team-grid { grid-template-columns: 1fr; } }

        .t-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; overflow: hidden; transition: transform 0.3s;
            box-shadow: var(--glow);
        }
        .t-card:hover { transform: translateY(-10px); }

        .t-head { padding: 20px; text-align: center; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border-color); }
        .t-logo { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--text-gold); padding: 3px; object-fit: cover; }
        .t-name { margin: 10px 0 0; font-size: 1.4rem; color: var(--text-main); }

        .t-stats { display: flex; border-bottom: 1px solid var(--border-color); }
        .t-stat { flex: 1; text-align: center; padding: 10px 0; border-right: 1px solid var(--border-color); }
        .t-stat:last-child { border: none; }
        .ts-val { display: block; font-size: 1.3rem; font-weight: bold; color: var(--text-gold); font-family: 'Cinzel Decorative'; }
        .ts-lbl { font-size: 0.75rem; text-transform: uppercase; opacity: 0.6; }

        .t-players { padding: 15px 20px; }
        .t-players ul { list-style: none; padding: 0; margin: 0; }
        .t-players li { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        .t-players li::before { content: '✦'; color: var(--text-gold); margin-right: 8px; }

        /* Footer */
        .footer { text-align: center; opacity: 0.6; font-size: 0.9rem; margin-top: 50px; font-style: italic; }

    </style>
</head>
<body class="dark-theme"> 

    <nav class="navbar">
        <div class="nav-left">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Hogwarts_coat_of_arms_colored_with_shading.svg" alt="Logo" class="site-logo">
            <h1 class="site-name">Hogwarts Ligi</h1>
        </div>
        
        <button class="theme-btn" onclick="toggleTheme()">☀️ Lumos / ✨ Nox</button>
    </nav>

    <div class="container">
        
        <div class="header-box">
            <h1 class="main-title" id="main-title">DUYURULAR</h1>
            <div class="announcement-text" id="announcement-text">
                "Turnuva kayıtları kapanmıştır. İlk düdük çalmak üzere!"
            </div>
            <div class="countdown" id="main-timer">00:00:00</div>
        </div>

        <div class="widget-row">
            <div class="widget-card">
                <div class="w-title">SIRADAKİ MÜCADELE</div>
                <div class="w-big-text" id="nm-teams">...</div>
                <div class="w-sub" id="nm-timer">--:--</div>
                <div style="margin-top:10px; opacity:0.7; font-style:italic;" id="nm-loc">...</div>
            </div>
            <div class="widget-card">
                <div class="w-title">SAHA DURUMU</div>
                <div class="weather-wrap">
                    <div class="weather-icon" id="w-icon">☁️</div>
                    <div>
                        <div class="w-big-text" id="w-temp">--°C</div>
                        <div style="opacity:0.8;" id="w-desc">--</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section-header"><h2>Turnuva Tablosu</h2></div>
        
        <div class="bracket-section">
            <div class="bracket-container">
                <div class="column col-qf" id="qf-col"></div>
                <div class="column col-sf" id="sf-col"></div>
                <div class="column col-fi" id="fi-col"></div>
            </div>
        </div>

        <div class="section-header"><h2>Takım Kadroları & İstatistikler</h2></div>
        
        <div class="team-grid" id="teams-container">
            </div>

        <div class="footer">
            Sihir Bakanlığı Onaylıdır. © 2026 Hogwarts Spor Dairesi.
        </div>
    </div>

    <script>
        /* ================= KULLANICI AYARLARI ================= */
        const AYARLAR = {
            baslik: "DUYURULAR PANELİ", // Burayı değiştirdim
            duyuruMetni: "Büyük turnuva için geri sayım başladı. Tüm yarışmacılara bol şans!",
            hedefTarih: "Oct 31, 2025 19:00:00",

            sonrakiMac: {
                takimlar: "Mahşerin 3 Tatlısı vs Lubunyalar",
                tarih: "Jan 15, 2026 20:00:00",
                yer: "Quidditch Sahası",
                hava: "karli", derece: "-2 °C"
            },

            // TAKIMLAR
            takimlar: [
                { ad: "Mahşerin 3 Tatlısı", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQN2EDog_DUPwEp4BoAshpn3O3TJJdMcpwrVA&s", gol: 0, win: 0, kadro: ["Vortex Piece", "Gilbert M. Violia", "Luna A. Hunter"] },
                { ad: "Lubunyalar", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSyPtqsLUG0vM5yUSMdDZ6Umanek7i2Aqtmhw&s", gol: 0, win: 0, kadro: ["Ryuga Wise", "Shaw Marston", "Edith Docile"] },
                { ad: "Enikler", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ99gbmzb1p7I1MNEOGA_rW9-r4Wl9QDOElhA&s", gol: 0, win: 0, kadro: ["Arch Grayera", "Aveline M. Violia", "Alkar Nightfall"] },
                { ad: "Bunaklar", logo: "https://i.makeagif.com/media/5-06-2016/p5iGE1.gif", gol: 0, win: 0, kadro: ["Vuggie Smart", "Rashard Cexly ", "Michael Vilin"] },
                { ad: "Takım 5", logo: "https://via.placeholder.com/70/333/FFFFFF?text=T5", gol: 0, win: 0, kadro: ["Bilinmiyor", "Bilinmiyor", "Bilinmiyor"] },
                { ad: "Takım 6", logo: "https://via.placeholder.com/70/333/FFFFFF?text=T6", gol: 0, win: 0, kadro: ["Bilinmiyor", "Bilinmiyor", "Bilinmiyor"] },
                { ad: "Takım 7", logo: "https://via.placeholder.com/70/333/FFFFFF?text=T7", gol: 0, win: 0, kadro: ["Bilinmiyor", "Bilinmiyor", "Bilinmiyor"] },
                { ad: "Takım 8", logo: "https://via.placeholder.com/70/333/FFFFFF?text=T8", gol: 0, win: 0, kadro: ["Bilinmiyor", "Bilinmiyor", "Bilinmiyor"] }
            ],

            // EŞLEŞMELER
            maclar: {
                qf: [
                    { t1: "Mahşerin 3 Tatlısı", s1: "0", t2: "Lubunyalar", s2: "0" },
                    { t1: "Enikler", s1: "0", t2: "Bunaklar", s2: "0" },
                    { t1: "Takım 5", s1: "0", t2: "Takım 6", s2: "0" },
                    { t1: "Takım 7", s1: "0", t2: "Takım 8", s2: "0" }
                ],
                sf: [
                    { t1: "???", s1: "-", t2: "???", s2: "-" },
                    { t1: "???", s1: "-", t2: "???", s2: "-" }
                ],
                fi: [
                    { t1: "???", s1: "", t2: "???", s2: "" }
                ]
            }
        };

        /* ================= SİSTEM KODLARI ================= */
        
        // 1. Tema
        function toggleTheme() {
            if(document.body.classList.contains('dark-theme')) {
                document.body.classList.remove('dark-theme');
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
                document.body.classList.add('dark-theme');
            }
        }

        // 2. Sayaçlar
        function startTimer(target, elemId, endMsg) {
            const countDate = new Date(target).getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const gap = countDate - now;
                if(gap < 0) {
                    document.getElementById(elemId).innerText = endMsg;
                } else {
                    const d = Math.floor(gap / (1000*60*60*24));
                    const h = Math.floor((gap % (1000*60*60*24)) / (1000*60*60));
                    const m = Math.floor((gap % (1000*60*60)) / (1000*60));
                    document.getElementById(elemId).innerText = `${d}G ${h}S ${m}D`;
                }
            }, 1000);
        }

        // 3. Hava Durumu
        function setWeather() {
            const w = AYARLAR.sonrakiMac;
            let icon = "☁️";
            if(w.hava === "gunesli") icon = "☀️";
            if(w.hava === "yagmurlu") icon = "🌧️";
            if(w.hava === "karli") icon = "❄️";
            
            document.getElementById('w-icon').innerText = icon;
            document.getElementById('w-temp').innerText = w.derece;
            document.getElementById('w-desc').innerText = w.hava.toUpperCase();
        }

        // 4. İçerik Doldurma (Kartlar & Ağaç)
        function render() {
            // Başlıklar ve Duyuru
            document.getElementById('main-title').innerText = AYARLAR.baslik;
            document.getElementById('announcement-text').innerText = AYARLAR.duyuruMetni;
            startTimer(AYARLAR.hedefTarih, 'main-timer', "BAŞLADI!");

            // Widget
            document.getElementById('nm-teams').innerText = AYARLAR.sonrakiMac.takimlar;
            document.getElementById('nm-loc').innerText = AYARLAR.sonrakiMac.yer;
            startTimer(AYARLAR.sonrakiMac.tarih, 'nm-timer', "OYNANIYOR");
            setWeather();

            // Takım Logosu Bulma
            const getLogo = (name) => {
                const team = AYARLAR.takimlar.find(t => t.ad === name);
                return team ? team.logo : "https://via.placeholder.com/30?text=?";
            };

            // Maç Kartı HTML
            const createMatchHTML = (m) => `
                <div class="match-card">
                    <div class="m-team">
                        <div><img src="${getLogo(m.t1)}" class="m-logo"><span class="m-name">${m.t1}</span></div>
                        <span class="m-score">${m.s1}</span>
                    </div>
                    <div class="m-team">
                        <div><img src="${getLogo(m.t2)}" class="m-logo"><span class="m-name">${m.t2}</span></div>
                        <span class="m-score">${m.s2}</span>
                    </div>
                </div>
            `;

            // Ağacı Doldur
            document.getElementById('qf-col').innerHTML = AYARLAR.maclar.qf.map(createMatchHTML).join('');
            document.getElementById('sf-col').innerHTML = AYARLAR.maclar.sf.map(createMatchHTML).join('');
            document.getElementById('fi-col').innerHTML = AYARLAR.maclar.fi.map(createMatchHTML).join('');

            // Takım Kartlarını Doldur
            const teamHTML = AYARLAR.takimlar.map(t => `
                <div class="t-card">
                    <div class="t-head">
                        <img src="${t.logo}" class="t-logo">
                        <h3 class="t-name brand-font">${t.ad}</h3>
                    </div>
                    <div class="t-stats">
                        <div class="t-stat">
                            <span class="ts-val">${t.gol}</span>
                            <span class="ts-lbl">GOL</span>
                        </div>
                        <div class="t-stat">
                            <span class="ts-val">${t.win}</span>
                            <span class="ts-lbl">GALİBİYET</span>
                        </div>
                    </div>
                    <div class="t-players">
                        <ul>${t.kadro.map(p => `<li>${p}</li>`).join('')}</ul>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('teams-container').innerHTML = teamHTML;
        }

        render();
    </script>
</body>
</html>
